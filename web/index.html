<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#F4EDE0" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23A9714D' d='M12 1.5l1.7 3.1 2.4-1.1-.8 2.7 3.3.5-2.3 2 1.4 2.4-3.1 0-.4 2.5-1.9-1.7v7.3h-.9l0-7.3-1.9 1.7-.4-2.5-3.1 0 1.4-2.4-2.3-2 3.3-.5-.8-2.7 2.4 1.1z'/%3E%3C/svg%3E" />
<title>AI 诗人 / 歌词生成器</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- 背景层：宣纸底 + 水墨晕染 + 纤维纹理 + 边角枝影，全部不参与交互 -->
  <div class="paper-wash" aria-hidden="true"></div>

  <svg class="ink-branch ink-branch--left" viewBox="0 0 340 300" aria-hidden="true">
    <g fill="none" stroke="#8B6A52" stroke-linecap="round">
      <path d="M-6 12 C 66 34 128 66 178 118 C 210 150 246 164 300 166" stroke-width="1.5" opacity=".5" />
      <path d="M58 40 C 76 60 86 84 88 114" stroke-width="1.1" opacity=".42" />
      <path d="M124 80 C 114 100 112 122 116 142" stroke-width="1.1" opacity=".38" />
      <path d="M178 118 C 196 108 216 104 236 106" stroke-width="1" opacity=".34" />
      <path d="M206 146 C 214 160 216 176 212 192" stroke-width="1" opacity=".3" />
    </g>
    <g fill="#9A7358" opacity=".26">
      <circle cx="88" cy="114" r="2.6" />
      <circle cx="82" cy="108" r="2.1" />
      <circle cx="94" cy="108" r="2.1" />
      <circle cx="88" cy="101" r="2.1" />
      <circle cx="116" cy="142" r="2.4" />
      <circle cx="236" cy="106" r="2.5" />
      <circle cx="230" cy="100" r="2" />
      <circle cx="242" cy="100" r="2" />
      <circle cx="212" cy="192" r="2.2" />
    </g>
  </svg>

  <svg class="ink-branch ink-branch--right" viewBox="0 0 320 300" aria-hidden="true">
    <g fill="none" stroke="#8B6A52" stroke-linecap="round">
      <path d="M326 296 C 276 268 226 226 196 176 C 178 146 168 122 164 96" stroke-width="1.4" opacity=".42" />
      <path d="M252 240 C 248 218 244 202 236 188" stroke-width="1" opacity=".34" />
      <path d="M206 188 C 214 172 226 162 240 158" stroke-width="1" opacity=".3" />
    </g>
    <g fill="#9A7358" opacity=".22">
      <path d="M236 188 C 244 166 258 152 274 148 C 266 168 252 182 236 188 Z" />
      <path d="M240 156 C 252 140 268 132 284 132 C 274 148 258 156 240 156 Z" />
      <path d="M198 172 C 200 152 210 136 224 128 C 220 148 212 162 198 172 Z" />
      <path d="M164 96 C 168 78 178 64 192 58 C 186 76 178 88 164 96 Z" />
    </g>
  </svg>

  <div class="fiber" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand-row">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
          <path d="M12 2.6l1.5 3.2 2.4-1.4-.6 3 3.4.3-2.1 2.4 1.3 2.6-3.1-.2-.3 2.9-2-1.9v7.6" />
          <path d="M12 2.6l-1.5 3.2L8.1 4.4l.6 3-3.4.3 2.1 2.4-1.3 2.6 3.1-.2.3 2.9 2-1.9" />
        </svg>
      </span>
      <h1 class="brand-title">AI 诗人 <span class="brand-slash">/</span> 歌词生成器</h1>
      <span class="seal" aria-hidden="true">詩</span>
      <p class="brand-sub">输入一个主题与风格，让大模型为你创作一首诗或一段歌词</p>
    </div>

    <div class="param-wrap">
      <button id="paramBtn" class="param-btn" type="button" aria-expanded="false" aria-controls="paramPanel">
        <span>参数设置</span>
        <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div id="paramPanel" class="param-panel" hidden>
        <div class="panel-head">
          <span>参数设置</span>
          <button id="panelCollapse" class="panel-collapse" type="button" aria-label="收起参数面板">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <div class="field">
          <label class="field-label" for="styleSelect">风格</label>
          <div class="select-wrap">
            <select id="styleSelect" class="field-select"></select>
            <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <p id="styleHint" class="field-hint"></p>
        </div>

        <div class="field field-inline">
          <span class="field-label">当前通道</span>
          <span id="modeValue" class="field-value">—</span>
        </div>

        <div class="field field-inline">
          <span class="field-label">主题字数上限</span>
          <span id="maxChars" class="field-value">—</span>
        </div>

        <button id="clearBtn" class="ghost-btn" type="button">清空对话</button>
      </div>
    </div>
  </header>

  <main id="chat" class="chat" aria-live="polite" aria-label="对话记录"></main>

  <form id="composer" class="composer" autocomplete="off">
    <button id="attachBtn" class="icon-btn" type="button" title="附件功能暂未开放" aria-label="附件（暂未开放）">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 7.5l-6.6 6.6a3 3 0 104.2 4.2l7-7a5 5 0 10-7.1-7.1l-7.4 7.4a7 7 0 009.9 9.9l4.2-4.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <input id="themeInput" class="composer-input" type="text" placeholder="输入你的主题..." maxlength="50" aria-label="主题" />

    <button id="emojiBtn" class="icon-btn" type="button" title="表情功能暂未开放" aria-label="表情（暂未开放）">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="9.2" cy="10.2" r="1" fill="currentColor"/><circle cx="14.8" cy="10.2" r="1" fill="currentColor"/><path d="M8.8 14.2c.85 1.2 1.9 1.8 3.2 1.8s2.35-.6 3.2-1.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>

    <button id="sendBtn" class="send-btn" type="submit" aria-label="发送">
      <svg class="icon-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.8 11.6l14.4-6.3-5.3 14.4-3-5.9-6.1-2.2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M10.9 14.4l8.3-9.1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7.5" y="7.5" width="9" height="9" rx="1.6" fill="currentColor"/></svg>
    </button>
  </form>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
